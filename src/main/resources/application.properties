spring.application.name=minecraft-taller-git-2026
spring.datasource.url=jdbc:h2:file:./data/entidades
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.fail-on-unknown-properties=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

integracion.ruth.base-url=${RUTH_BASE_URL:http://localhost:8081}
integracion.ruth.explosion-path=${RUTH_EXPLOSION_PATH:/api/minecraft/simulaciones/explosion}
integracion.matias.base-url=${MATIAS_BASE_URL:http://localhost:8082}
integracion.matias.explosion-path=${MATIAS_EXPLOSION_PATH:/api/simulaciones/explosion}
